version: 2
updates:
- package-ecosystem: uv
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 15
  labels:
  - maintenance
  - dependencies
  ignore:
  - dependency-name: Django
    versions:
    - ">= 3.0"
  - dependency-name: urllib3
    versions:
    - ">= 0"
  # Matches `exclude-newer` in `pyproject.toml`, so Dependabot never proposes a version uv refuses to lock
  cooldown:
    default-days: 7
